name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # On pull_request, actions/checkout uses GitHub's synthetic merge ref.
      # Therefore the build validates current master + the PR. If GitHub
      # cannot construct that merge because of textual conflicts, the PR is
      # marked conflicted and cannot merge.
      - name: Check out merge candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Build production bundle
        run: npm run build
